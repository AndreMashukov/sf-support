[project]
name = "sf-support"
version = "0.1.0"
description = "StudyForge Support: tickets and hybrid RAG help"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "pgvector>=0.3.6",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.17",
  "jinja2>=3.1.4",
  "firebase-admin>=6.6.0",
  "httpx>=0.28.0",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langgraph>=0.2.0",
  "langsmith>=0.2.0",
  "google-cloud-pubsub>=2.27.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8.0",
  "pytest>=8.3.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["seed*", "tests*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
